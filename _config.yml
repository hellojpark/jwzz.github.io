# Site settings
title: "Jekyll Resume Template"
description: "A resume template for Jekyll and GitHub Pages sites."
baseurl: "/jwzz.github.io"
# baseurl: ""
url: "https://hellojpark.github.io"

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Jeongwoo Park"
resume_title:                   "About"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "jwzz1213@naver.com"

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_telephone:       "555-7334"
resume_contact_address:         "742 Evergreen Terrace, Springfield"

resume_header_contact_info:     "742 Evergreen Terrace, Springfield • 555-7334 • lisasimpson@youremailaddress.com"
display_header_contact_info:    "false"

resume_header_intro: "<p><strong>AI Engineer Who Takes on Challenges</strong></p>"
resume_header_sub: "도전을 성장의 출발점으로 삼았고, 새로운 환경에서 부딪혀 가며 배우는 방식을 선택해 왔습니다."
resume_intro_description: |
  <div class="intro-section">
    <h3 class="intro-heading">전공의 경계를 넘어 새로운 분야에 도전해 왔습니다.</h3>
    <p class="intro-content">기계공학을 전공했지만 컴퓨터 비전에 도전했고,<br>빠르게 성장해 <strong>해외 학회를 포함한 1저자 논문 2편과 특허 2건의 성과를 만들었습니다.</strong></p>
  </div>
  <div class="intro-section">
    <h3 class="intro-heading">전문성을 확장하기 위해 끊임없이 도전해 왔습니다.</h3>
    <p class="intro-content">AI Engineer로서 모델, 데이터, 서비스까지 이어지는 흐름을 이해하고자 했습니다.<br>대학원 졸업 이후 EDA 스터디를 주도해 데이터 분석 역량을 확장했고,<br>개인 및 팀 프로젝트를 통해 추천 서비스 및 교육용 AI Agent를 개발했습니다.</p>
  </div>
# resume_header_intro: "<p>I studied <strong>Gesture Recognition</strong>, <strong>Image Segmentation</strong>, and <strong>Gaussian Splatting</strong>, and I have continued to expand my expertise with a <strong>strong interest in AI technologies</strong>.</p>"

# CV PDF download link (Google Drive or direct PDF link)
cv_pdf_url: "https://drive.google.com/file/d/1qXnvG60HTnL0yAZA4HrDB5vwfejTQWY0/view?usp=drive_link"

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_looking_for_work:        "no"

# Decide which sections to use
# comment out to hide
resume_section_experience:      true
resume_section_education:       true
resume_section_projects:        true
resume_section_skills:          true
resume_section_recognition:     true
resume_section_links:           true
resume_section_associations:    true
# resume_section_interests:       true

# Resume social links
# uncomment the options you wish to display, and add your own URL
resume_social_links:
  resume_github_url:            "https://github.com/hellojpark"
  # resume_twitter_url:           "http://twitter.com/jglovier"
  # resume_dribbble_url:          "https://dribbble.com/jag"
  # resume_facebook_url:          "insert Facebook URL here"
  # resume_linkedin_url:          "https://www.linkedin.com/in/joelglovier"
  resume_instagram_url:         "https://www.instagram.com/jeongw_ood/"
  # resume_website_url:           "http://joelglovier.com"
  # resume_medium_url:            "https://medium.com/@jglovier"
resume_print_social_links:      true

# Design settings
resume_theme:                   default

